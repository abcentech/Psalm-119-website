name: Generate natural Red Letters audio
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - words-of-christ/generate_audio.py
      - .github/workflows/neural-audio.yml
permissions:
  contents: write
concurrency:
  group: red-letters-neural-audio
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        voice: [british, american]
        group:
          - {name: john-a, book: John, start: 1, end: 11}
          - {name: john-b, book: John, start: 12, end: 21}
          - {name: matthew-a, book: Matthew, start: 1, end: 9}
          - {name: matthew-b, book: Matthew, start: 10, end: 18}
          - {name: matthew-c, book: Matthew, start: 19, end: 28}
          - {name: mark, book: Mark, start: 1, end: 16}
          - {name: luke-a, book: Luke, start: 1, end: 12}
          - {name: luke-b, book: Luke, start: 13, end: 24}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice synthesis and MP3 encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libespeak-ng1 ffmpeg
          python -m pip install 'kokoro-onnx>=0.6.0,<0.7' numpy soundfile
      - name: Download Kokoro speech model
        run: |
          mkdir -p /tmp/kokoro
          curl --fail --location --retry 4 -o /tmp/kokoro/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl --fail --location --retry 4 -o /tmp/kokoro/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          test "$(stat -c%s /tmp/kokoro/kokoro-v1.0.onnx)" -gt 100000000
          test "$(stat -c%s /tmp/kokoro/voices-v1.0.bin)" -gt 20000000
      - name: Generate UK and US natural chapter recordings
        run: |
          python words-of-christ/generate_audio.py \
            --model /tmp/kokoro/kokoro-v1.0.onnx \
            --voices "${{ matrix.voice }}" \
            --book "${{ matrix.group.book }}" \
            --start "${{ matrix.group.start }}" \
            --end "${{ matrix.group.end }}"
      - name: Upload chapter recordings
        uses: actions/upload-artifact@v4
        with:
          name: redletters-${{ matrix.voice }}-${{ matrix.group.name }}
          path: words-of-christ/audio
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  publish:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          pattern: redletters-*
          path: words-of-christ/audio
          merge-multiple: true
      - name: Validate complete British and American audio libraries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import sys
          page = Path('words-of-christ/index.html').read_text()
          match = re.search(r'<script id="scripture-data" type="application/json">(.*?)</script>', page, re.S)
          assert match, 'The Gospel corpus is missing'
          books = json.loads(match.group(1))['books']
          required = [(b['n'].lower(), c['n'], len(c['e'])) for b in books for c in b['c']]
          assert len(required) == 85
          totalbytes=0
          for voice in ('british', 'american'):
              for book, chapter, segments in required:
                  slug=f'{book}-{chapter:02d}'
                  root=Path('words-of-christ/audio')/voice
                  path=root/f'{slug}.mp3'
                  metadata=root/f'{slug}.json'
                  assert path.exists() and path.stat().st_size>1000, path
                  t=json.loads(metadata.read_text())
                  assert len(t['segments'])==segments, metadata
                  assert all(x['words'] and x['end_ms']>x['start_ms'] for x in t['segments']), metadata
                  totalbytes+=path.stat().st_size
          print('VERIFIED',len(required),'chapters,',len(required)*2,'recordings,',round(totalbytes/1048576,1),'MiB')
          PY
      - name: Publish verified natural narration to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words-of-christ/audio
          if ! git diff --cached --quiet; then
            git commit -m "audio: publish complete verified British and American natural Gospel narration"
            git push origin HEAD:gh-pages
          fi
