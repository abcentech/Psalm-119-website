name: Probe natural UK US Nigerian voices
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/neural-voice-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech client
        run: python -m pip install 'edge-tts==7.2.7'
      - name: Test three distinct accent voices
        run: |
          set -e
          for voice in en-GB-SoniaNeural en-US-JennyNeural en-NG-EzinneNeural; do
            echo "Testing $voice"
            edge-tts --voice "$voice" --text 'The words that I speak unto you, they are spirit, and they are life.' --write-media "/tmp/$voice.mp3" --write-subtitles "/tmp/$voice.vtt"
            test -s "/tmp/$voice.mp3"
            test -s "/tmp/$voice.vtt"
            du -h "/tmp/$voice.mp3"
            head -n 5 "/tmp/$voice.vtt"
          done
